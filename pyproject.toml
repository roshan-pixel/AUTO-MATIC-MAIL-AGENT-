[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-matic-mail-agent"
version = "1.0.0"
description = "Autonomous browser-driven and protocol-level email agent for Outlook and Gmail with CDP recipient validation, legal grievance automation, and zero-leak privacy guards."
authors = [
    {name = "Roshan Rathore", email = "sgarmy200@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "playwright>=1.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
auto-mail = "auto_mail.agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

